name: Release

# Builds the `synapsed` daemon natively for Linux x86_64 and aarch64 and attaches the tarballs
# (plus SHA256SUMS) to a GitHub Release. Runs on every `v*` tag; can also be run by hand for an
# existing tag via "Run workflow" (useful to backfill a release).
#
# Binaries are built on Ubuntu 22.04 (glibc 2.35, OpenSSL 3) so they run on that and anything
# newer (Debian 12+, Ubuntu 22.04+, Fedora, Arch, ...). For older or musl-based hosts use the
# Docker image or build from source.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v2.2.19)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config protobuf-compiler libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p synapsed

      - name: Package
        run: |
          name="synapse-${TAG}-linux-${{ matrix.arch }}"
          mkdir "$name"
          cp target/release/synapsed example_config.toml LICENSE README.md "$name/"
          tar czf "$name.tar.gz" "$name"
          "./$name/synapsed" --version || true

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: synapse-*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true

      - name: Checksums
        run: sha256sum synapse-*.tar.gz | tee SHA256SUMS

      - name: Extract release notes from CHANGELOG
        run: |
          ver="${TAG#v}"
          awk -v v="$ver" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Synapse ${TAG}" > notes.md

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="synapse-*.tar.gz SHA256SUMS"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber
          else
            gh release create "$TAG" $files --title "Synapse ${TAG}" --notes-file notes.md --verify-tag
          fi
