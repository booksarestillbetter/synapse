[workspace]
resolver = "2"
members = [
    "crates/synapse-bencode",
    "crates/synapse-config",
    "crates/synapse-meta",
    "crates/synapse-wire",
    "crates/synapse-picker",
    "crates/synapse-diskio",
    "crates/synapse-tracker",
    "crates/synapse-dht",
    "crates/synapse-engine",
    "crates/synapse-daemon",
    "crates/synapse-rpc",
    "crates/synapse-bench",
    "crates/synapse-proto",
    "crates/synapse-client",
]

[workspace.package]
version = "2.2.2"
edition = "2021"
license = "ISC"
publish = false

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "fs", "time", "signal", "process"] }
bytes = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive"] }
roaring = "0.10"
async-trait = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
lto = "thin"


