# Cargo Deny Configuration for Synapse 2.0 (Phase 6 Assurance)
# See https://embarkstudios.github.io/cargo-deny/

[advisories]
# cargo-deny >= 0.16 (what EmbarkStudios/cargo-deny-action@v2 runs) always denies known
# vulnerabilities and no longer accepts the old `vulnerability`, `unlicensed` and `notice`
# keys, so only the remaining options are set here.
yanked = "deny"
ignore = [
    # `rsa` (Marvin attack, a timing side channel in private-key operations). Synapse only
    # verifies torrent signatures with public keys (BEP 35) and never decrypts or signs, so the
    # affected operations are not reachable. No fixed release exists; revisit when one does.
    { id = "RUSTSEC-2023-0071", reason = "only RSA public-key verification is used; private-key operations are unreachable" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = []
skip = []
skip-tree = []

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0", # webpki-roots (the bundled root certificate list)
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
