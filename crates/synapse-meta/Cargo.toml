[package]
name = "synapse-meta"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Torrent metadata (.torrent/magnet) parsing and piece/file layout for the synapse rewrite. See doc/REWRITE_ROADMAP.md."

[dependencies]
synapse-bencode = { path = "../synapse-bencode" }
thiserror = { workspace = true }
url = "2"
rand = "0.8"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = { version = "0.10", features = ["oid"] }
serde = { version = "1", features = ["derive"] }
parking_lot = "0.12"
quick-xml = "0.42"
rsa = { version = "0.9", default-features = false, features = ["std", "pem"] }
x509-cert = { version = "0.2", default-features = false, features = ["std", "pem"] }

[dev-dependencies]
proptest = { workspace = true }
tempfile = "3"
