name: Rust

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-fmt:
    name: Lint & Format Gates
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
    - name: Check Formatting
      run: cargo fmt --check
    - name: Clippy Warnings As Errors
      run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Workspace Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
    - name: Version of Rust and Cargo
      run: rustc --version && cargo --version
    - name: Build
      run: cargo build --workspace --locked --verbose
    - name: Test
      run: cargo test --workspace --locked --verbose

  deny:
    name: Cargo Deny (Licenses & Bans)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: EmbarkStudios/cargo-deny-action@v2

  security-audit:
    name: Security Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: rustsec/audit-check@v1.4.1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

  package:
    name: Debian Package Build
    runs-on: ubuntu-latest
    needs: [lint-and-fmt, test, deny]
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
    - name: Install cargo-deb
      run: cargo install cargo-deb --locked
    - name: Build
      run: cargo build --locked --release --all --verbose
    - name: Package as deb file
      run: cargo deb --no-build --verbose
    - name: Upload Artifact Linux
      uses: actions/upload-artifact@v4
      with:
        name: synapse_sycli
        path: |
          target/release/synapse
          target/release/sycli
    - name: Upload Artifact Linux as .deb package
      uses: actions/upload-artifact@v4
      with:
        name: synapse_deb
        path: target/debian/*.deb
