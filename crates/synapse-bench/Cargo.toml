[package]
name = "synapse-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Load testing, synthetic swarm simulation, and benchmark harness for Synapse 2.0."

[[bin]]
name = "synapse-bench"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "macros", "fs", "time", "net"] }
bytes = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
hex = "0.4"
rand = "0.8"
tempfile = "3"
parking_lot = "0.12"
tonic = "0.12"
futures = "0.3"
tokio-stream = "0.1"
synapse-meta = { path = "../synapse-meta" }
synapse-wire = { path = "../synapse-wire" }
synapse-picker = { path = "../synapse-picker" }
synapse-diskio = { path = "../synapse-diskio" }
synapse-dht = { path = "../synapse-dht" }
synapse-engine = { path = "../synapse-engine" }
synapse-rpc = { path = "../synapse-rpc" }
synapse-config = { path = "../synapse-config" }
