name: Rust

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install protoc
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Version of Rust and Cargo
      run: rustc --version && cargo --version

    - name: Build
      run: cargo build --workspace --locked --verbose

    - name: Test
      run: cargo test --workspace --locked --verbose

    - name: Clippy
      run: cargo clippy --workspace --all-targets --locked -- -D warnings

    - name: Format check
      run: cargo fmt --all -- --check

  security-audit:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: rustsec/audit-check@v1.4.1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

  release-binary:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Install protoc
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Build release binary
      run: cargo build --release --locked -p synapsed --verbose

    - name: Upload synapsed binary
      uses: actions/upload-artifact@v4
      with:
        name: synapsed-linux-x86_64
        path: target/release/synapsed
